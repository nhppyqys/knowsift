name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Rebuild real-world benchmark
        run: python examples/short-drama-benchmark/generate_benchmark.py
      - name: Rebuild AI folklore benchmark
        run: python examples/ai-folklore-benchmark/generate_benchmark.py
      - name: Rebuild minimal demo
        run: python examples/learning-english/generate_demo.py
      - name: Verify generated document is committed
        run: git diff --exit-code
